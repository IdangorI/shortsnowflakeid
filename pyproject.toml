[project]
name = "shortsnowflakeid"
version = "1.0.0"
authors = [
  { name="idangori", email="shake@takeyourdata.org" },
]
description = "A lightweight Python library that combines Snowflake-style distributed IDs with compact, time-sorted, and URL-friendly strings."
readme = "README.md"
requires-python = ">=3.6"
classifiers = [
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
license = "BSD-3-Clause"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/IdangorI/shortsnowflakeid"
Issues = "https://github.com/IdangorI/shortsnowflakeid/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"